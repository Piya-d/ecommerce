# Ports are offset from crm-application (80 / 5432) so both stacks can run
# side by side.

x-oro-environment: &oro-environment
  ORO_ENV: dev
  ORO_SECRET: local-development-secret
  ORO_DB_URL: postgresql://oro_user:oro_pass@postgres:5432/commerce?sslmode=disable&charset=utf8&serverVersion=17
  ORO_DB_DSN: postgresql://oro_user:oro_pass@postgres:5432/commerce?sslmode=disable&charset=utf8&serverVersion=17
  ORO_REDIS_URL: redis://redis:6379
  ORO_SESSION_DSN: redis://redis:6379/0
  ORO_REDIS_CACHE_DSN: redis://redis:6379/1
  ORO_REDIS_DOCTRINE_DSN: redis://redis:6379/2
  ORO_REDIS_LAYOUT_DSN: redis://redis:6379/3
  ORO_SEARCH_URL: 'orm:'
  ORO_SEARCH_ENGINE_DSN: 'orm:?prefix=oro_search'
  ORO_WEBSITE_SEARCH_ENGINE_DSN: 'orm:?prefix=oro_website_search'
  ORO_MQ_DSN: 'dbal:'
  ORO_MAILER_DSN: smtp://mailcatcher:1025
  ORO_PDF_GENERATOR_GOTENBERG_API_URL: http://gotenberg:3000
  # Keys live on the app-data volume so they survive container recreation.
  ORO_OAUTH_PUBLIC_KEY_PATH: '%kernel.project_dir%/var/data/oauth_public.key'
  ORO_OAUTH_PRIVATE_KEY_PATH: '%kernel.project_dir%/var/data/oauth_private.key'

# Attachments, product images and generated media are written by both the web
# app and the consumer, so they share named volumes. var/cache is shared too:
# it holds the extended-entity metadata, and a consumer with its own copy goes
# stale after install or migrations ("Scope has no field webCatalog").
x-oro-volumes: &oro-volumes
  - app-cache:/var/www/html/var/cache
  - app-data:/var/www/html/var/data
  - app-media:/var/www/html/public/media

services:
  app:
    build:
      context: .
    image: commerce-application:local
    environment: *oro-environment
    volumes: *oro-volumes
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      gotenberg:
        condition: service_started
      mailcatcher:
        condition: service_started
    ports:
      - "8080:80"

  # Processes the message queue (storefront search indexing, image resizing,
  # emails, imports). It exits until bin/docker-install.sh has installed the
  # application; restart keeps retrying until then.
  consumer:
    image: commerce-application:local
    pull_policy: never
    command: ["php", "bin/console", "oro:message-queue:consume", "--memory-limit=700", "--time-limit=+30 minutes", "-vv"]
    user: www-data
    environment: *oro-environment
    volumes: *oro-volumes
    restart: unless-stopped
    depends_on:
      - app

  postgres:
    image: postgres:17-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: commerce
      POSTGRES_USER: oro_user
      POSTGRES_PASSWORD: oro_pass
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/uuid-ossp.sql:/docker-entrypoint-initdb.d/uuid-ossp.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oro_user -d commerce"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data

  gotenberg:
    image: gotenberg/gotenberg:8
    command:
      - gotenberg
      - --api-timeout=60s

  # Catches outgoing mail (registration, order confirmations). UI on :1080.
  mailcatcher:
    image: schickling/mailcatcher
    ports:
      - "1080:1080"

volumes:
  postgres-data:
  redis-data:
  app-cache:
  app-data:
  app-media:
